name: wheels

# Binary wheels for Linux, macOS and Windows, so that `pip install backlog-qec`
# needs no compiler. Runs by hand (Actions > wheels > Run workflow) and on
# version tags; a tag also publishes to PyPI through trusted publishing (see
# CONTRIBUTING.md for the one-time PyPI setup).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-13, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test wheels
        run: pipx run cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_* *-win32 *_i686"
          CIBW_TEST_COMMAND: >-
            python -c "import backlog, stim;
            c = stim.Circuit.generated('surface_code:rotated_memory_z', distance=3, rounds=3,
            after_clifford_depolarization=0.002);
            d = backlog.UnionFindDecoder.from_circuit(c, correlated=True);
            s, o = c.compile_detector_sampler(seed=1).sample(2000, separate_observables=True);
            assert (d.decode_batch(s) != o).any(axis=1).mean() < 0.05; print('ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
