name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System tools (C++ toolchain, VHDL simulator)
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ghdl

      - name: Python dependencies
        run: pip install -r requirements.txt

      - name: Build and install the package (C++ core, pybind11 bindings)
        run: make install

      - name: C++ unit tests, 75,000 fuzzed cases against the reference decoder
        run: make test-cpp

      - name: Python tests (accuracy gates against PyMatching, sinter integration)
        run: make test-py

      - name: Command-line decoder on graphs exported from Stim
        run: make test-cli

      - name: Mutation testing (every injected bug must be caught)
        run: make mutants

      - name: Threshold pipeline smoke test (Stim + PyMatching)
        run: make quick

      - name: VHDL simulation, bit-exact against the golden model
        run: make hw-sim
